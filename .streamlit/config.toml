# DAISY ("DBS AI, Straight with You"): DBS colours and design language. DBS red (#FF3333) for actions and
# accents, black (#000000) type on white, light grey surfaces, one clean sans-serif. Light only: a single
# [theme] section locks the look, so there is no dark mode to switch to.
# Small red text (links, red badges) uses #DC1F1F: #FF3333 on white is about 3.6:1, below the 4.5:1 small text needs;
# #DC1F1F is about 4.9:1 on white and 4.6:1 on the red-tinted surfaces. No DBS logo or trademarked assets are used.

[theme]
base = "light"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
headingFontWeights = [700, 700, 600, 600, 600, 600]
baseRadius = "0.85rem"
buttonRadius = "full"
showWidgetBorder = true
showSidebarBorder = false
linkUnderline = false
metricValueFontSize = "1.9rem"
metricValueFontWeight = 600
primaryColor = "#FF3333"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FFF5F5"
textColor = "#000000"
borderColor = "#F5DADA"
linkColor = "#DC1F1F"
codeBackgroundColor = "#FFF5F5"
redColor = "#DC1F1F"
greenColor = "#0F8A5F"
orangeColor = "#C2410C"
blueColor = "#1D4ED8"
dataframeHeaderBackgroundColor = "#FFF5F5"
chartCategoricalColors = ["#FF3333", "#000000", "#0E9F9A", "#F59E0B", "#6366F1", "#64748B", "#DB2777"]

[theme.sidebar]
backgroundColor = "#FFF5F5"
secondaryBackgroundColor = "#FFEAEA"
codeBackgroundColor = "#FFEAEA"
textColor = "#000000"
borderColor = "#F5DADA"
primaryColor = "#FF3333"
linkColor = "#DC1F1F"

[client]
toolbarMode = "minimal"
